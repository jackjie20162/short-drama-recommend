syntax = "proto3";

package user;
option go_package = "short-drama-recommend/rpc/user-rpc/pb";

message User {
  int64 id = 1;
  string country = 2;
  string language = 3;
  string locale = 4;
  string timezone = 5;
}

message GetUserRequest { int64 user_id = 1; }
message GetUserResponse { User user = 1; }

service UserService {
  rpc GetUser(GetUserRequest) returns (GetUserResponse);
}
