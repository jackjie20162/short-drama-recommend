syntax = "proto3";

package drama_admin;
option go_package = "short-drama-recommend/rpc/drama-rpc/pb";

import "drama.proto";

message CreateDramaRequest { string title=1; string description=2; string cover=3; string country=4; string language=5; int32 total_episodes=6; bool is_paid=7; int64 price_cents=8; string currency=9; }
message CreateDramaResponse { Drama drama=1; }
message UpdateDramaRequest { int64 id=1; string title=2; string description=3; string cover=4; string country=5; string language=6; int32 total_episodes=7; bool is_paid=8; int64 price_cents=9; string currency=10; }
message UpdateDramaResponse { Drama drama=1; }
message SetDramaStatusRequest { int64 id=1; int32 status=2; }
message SetDramaStatusResponse { bool success=1; }
message AdminListDramaRequest { string keyword=1; string country=2; string language=3; int32 status=4; int32 page=5; int32 page_size=6; }
message AdminListDramaResponse { repeated Drama items=1; int64 total=2; }
message CreateEpisodeRequest { int64 drama_id=1; int32 episode_no=2; string title=3; int32 duration_seconds=4; string video_url=5; string poster_url=6; bool is_paid=7; }
message Episode { int64 id=1; int64 drama_id=2; int32 episode_no=3; string title=4; int32 duration_seconds=5; string video_url=6; string poster_url=7; bool is_paid=8; int32 status=9; }
message CreateEpisodeResponse { Episode episode=1; }
message ListEpisodeRequest { int64 drama_id=1; int32 status=2; }
message ListEpisodeResponse { repeated Episode items=1; }
message SetEpisodeStatusRequest { int64 id=1; int32 status=2; }
message SetEpisodeStatusResponse { bool success=1; }

service DramaAdminService {
 rpc CreateDrama(CreateDramaRequest) returns (CreateDramaResponse);
 rpc UpdateDrama(UpdateDramaRequest) returns (UpdateDramaResponse);
 rpc SetDramaStatus(SetDramaStatusRequest) returns (SetDramaStatusResponse);
 rpc AdminListDrama(AdminListDramaRequest) returns (AdminListDramaResponse);
 rpc CreateEpisode(CreateEpisodeRequest) returns (CreateEpisodeResponse);
 rpc ListEpisode(ListEpisodeRequest) returns (ListEpisodeResponse);
 rpc SetEpisodeStatus(SetEpisodeStatusRequest) returns (SetEpisodeStatusResponse);
}