name: build-and-test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'
          cache: true
      - uses: arduino/setup-protoc@v3
        with:
          version: '28.3'
      - name: Install goctl and protobuf generators
        run: |
          go install github.com/zeromicro/go-zero/tools/goctl@v1.10.3
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.34.2
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@v1.5.1
      - name: Generate API and RPC
        run: make gen-api gen-rpc
      - name: Generate Ent ORM
        run: go run -mod=mod entgo.io/ent/cmd/ent generate --template glob="./rpc/ent/template/*.tmpl" ./rpc/ent/schema --feature sql/execquery,intercept,sql/modifier
      - name: Go test
        run: go test ./...
      - name: Go build services
        run: |
          for s in user-rpc drama-rpc behavior-rpc recommend-rpc payment-rpc drama-api drama-admin-api; do
            go build ./$s
          done

  client:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [client-tauri, admin-tauri]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        working-directory: ${{ matrix.app }}
        run: npm install
      - name: Build Vue app
        working-directory: ${{ matrix.app }}
        run: npm run build
